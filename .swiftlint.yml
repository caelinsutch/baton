# Keep the defaults. These few adjustments match how the code is written.
included:
  - Sources
  - Tests
excluded:
  - .build
  - dist

line_length:
  warning: 140
  error: 160
  ignores_comments: true

identifier_name:
  min_length: 3
  excluded: [id, url, x, y]

# The tool descriptions are prompts. They are long on purpose.
type_body_length:
  warning: 400
file_length:
  warning: 500
  error: 800
