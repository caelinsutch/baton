# SwiftLint configuration.
#
# CI runs `--strict`, so a warning fails the build. That is only reasonable if
# the enabled rules match how this code is actually written, so the deviations
# below are deliberate rather than a way to silence noise.

included:
  - Sources
  - Tests
excluded:
  - .build
  - dist

disabled_rules:
  # Trailing commas in multiline literals are idiomatic modern Swift and what
  # swift-format produces. They also keep diffs to one line when an entry is
  # added, which matters in the JSON schema literals.
  - trailing_comma

line_length:
  warning: 140
  error: 160
  ignores_comments: true

identifier_name:
  min_length: 3
  # Short names that are clearer than any longer alternative.
  excluded: [id, url, x, y]

large_tuple:
  # A labelled 3-tuple is the right shape for a small local grouping, for
  # example (label:tasks:) or (script:output:cleanup:) in a test helper.
  warning: 3
  error: 4

cyclomatic_complexity:
  # A protocol dispatch switch has one branch per method and is easier to read
  # as one flat switch than split across helpers.
  warning: 16
  error: 20

function_body_length:
  warning: 100
  error: 150

type_body_length:
  warning: 400
  error: 500

file_length:
  warning: 500
  error: 800
  ignore_comment_only_lines: true

# A SwiftUI view body is naturally nested.
nesting:
  type_level: 2
